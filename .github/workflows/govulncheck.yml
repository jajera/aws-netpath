---
name: govulncheck

on:
  pull_request: {}
  push:
    branches: [main]
  # A new CVE in a dependency is not tied to a commit: the tree can go from clean
  # to vulnerable without anything being pushed. The weekly run is what catches
  # that, rather than waiting for the next pull request to happen along.
  schedule:
    - cron: '17 4 * * 1'

# A scanner needs write scopes because the reusable reports findings back onto
# the pull request as a check run and a commit status. A called workflow is
# capped by what the caller grants, so granting less does not merely reduce what
# it can report: it makes this file invalid and the job never runs.
permissions:
  contents: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  govulncheck:
    uses: actionsforge/actions-govulncheck/.github/workflows/govulncheck.yml@v0.0.10
    with:
      go-version: stable
      mode: source
      include-tests: true
